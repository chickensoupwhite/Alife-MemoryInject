canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(zoom * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX, e.clientY);
}, {passive: false});

canvas.addEventListener('pointerdown', e => {
  if (e.target.closest('.node')) return;
  hideMenu();
  drag = {x: e.clientX - pan.x, y: e.clientY - pan.y};
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  pan.x = e.clientX - drag.x;
  pan.y = e.clientY - drag.y;
  project();
});
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('pointercancel', () => { drag = null; });
canvas.addEventListener('contextmenu', e => {
  if (e.target.closest('.node')) return;
  e.preventDefault();
  showMenu(e.clientX, e.clientY, null);
});

// 右侧面板宽度：可拖拽分隔条调整，双击复位，方向键微调；宽度记在本地。
const SIDE_WIDTH_KEY = 'memory-graph-side-width';
const SIDE_DEFAULT = 310;
const SIDE_MIN = 220;
function sideWidthBounds() {
  return {min: SIDE_MIN, max: Math.max(SIDE_MIN + 40, Math.min(900, window.innerWidth * 0.72))};
}
function applySideWidth(px) {
  const {min, max} = sideWidthBounds();
  const width = Math.max(min, Math.min(max, Math.round(px)));
  document.documentElement.style.setProperty('--side-width', width + 'px');
  try { localStorage.setItem(SIDE_WIDTH_KEY, String(width)); } catch (e) { /* 存储不可用就只在本次生效 */ }
  return width;
}
function currentSideWidth() {
  const raw = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--side-width'), 10);
  return Number.isFinite(raw) ? raw : SIDE_DEFAULT;
}
(function initSideSplitter() {
  const handle = $('sideSplitter');
  if (!handle) return;
  let saved = SIDE_DEFAULT;
  try {
    const value = parseInt(localStorage.getItem(SIDE_WIDTH_KEY) || '', 10);
    if (Number.isFinite(value) && value > 0) saved = value;
  } catch (e) { /* 忽略 */ }
  applySideWidth(saved);
  let dragging = false;
  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    dragging = true;
    handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!dragging) return;
    // 右侧留出 12px 间隙，避免把面板拖到贴边看不见
    applySideWidth(window.innerWidth - e.clientX - 12);
  });
  const stop = () => { dragging = false; handle.classList.remove('dragging'); };
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
  handle.addEventListener('dblclick', () => applySideWidth(SIDE_DEFAULT));
  handle.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); applySideWidth(currentSideWidth() + 24); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); applySideWidth(currentSideWidth() - 24); }
  });
  window.addEventListener('resize', () => applySideWidth(currentSideWidth()));
})();

const THEMES = ['native', 'light', 'ocean', 'forest', 'dark', 'glass'];
const THEME_LABEL = {native: '原生', light: '暖白', ocean: '海洋', forest: '森林', dark: '暗夜', glass: '玻璃'};
function currentTheme() {
  const hit = THEMES.find(t => document.body.classList.contains('theme-' + t));
  return hit || 'native';
}
function applyTheme(name) {
  if (!THEMES.includes(name)) name = 'native';
  THEMES.forEach(t => document.body.classList.remove('theme-' + t));
  document.body.classList.add('theme-' + name);
  document.documentElement.style.colorScheme = name === 'dark' ? 'dark' : 'light';
  const btn = $('themeBtn');
  btn.value = name;
  btn.setAttribute('aria-label', '当前主题：' + THEME_LABEL[name]);
  try { localStorage.setItem('memory-graph-theme', name); } catch (e) { }
}
$('themeBtn').onchange = event => {
  applyTheme(event.target.value);
};
try {
  let saved = localStorage.getItem('memory-graph-theme');
  applyTheme(saved || 'native');
} catch (e) { applyTheme('light'); }

if (window.ResizeObserver) new ResizeObserver(resizeGraph).observe(canvas);
